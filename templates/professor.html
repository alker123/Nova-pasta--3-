<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard {
            background: #fff;
            color: #333;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 350px;
        }
        h1 { color: #0056b3; margin-bottom: 10px; }
        p { font-size: 1.1em; color: #555; }
        .btn-logout {
            margin-top: 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Olá, Professor!</h1>
        <p>Bem-vindo ao seu painel de controle de Capoeira.</p>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
    </div>

    <script>
        function logout() {
            // Limpa qualquer dado de sessão se necessário
            alert("Saindo...");
            window.location.href = "index.html"; // Volta para a tela de login
        }
    </script>
</body>
</html>
